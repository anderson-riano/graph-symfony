apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderflow-outbox-publisher
  namespace: orderflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orderflow-outbox-publisher
  template:
    metadata:
      labels:
        app: orderflow-outbox-publisher
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: outbox-publisher
          image: graph-symfony-php:latest
          imagePullPolicy: IfNotPresent
          command:
            - php
            - bin/console
            - app:outbox:publish
            - --loop
            - --limit=50
            - --sleep-ms=1000
          envFrom:
            - configMapRef:
                name: orderflow-config
            - secretRef:
                name: orderflow-secret
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
