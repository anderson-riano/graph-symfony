apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderflow-worker
  namespace: orderflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orderflow-worker
  template:
    metadata:
      labels:
        app: orderflow-worker
    spec:
      containers:
        - name: worker
          image: graph-symfony-php:latest
          imagePullPolicy: IfNotPresent
          command:
            - php
            - bin/console
            - messenger:consume
            - async
            - -vv
            - --time-limit=3600
            - --memory-limit=256M
          envFrom:
            - configMapRef:
                name: orderflow-config
            - secretRef:
                name: orderflow-secret
