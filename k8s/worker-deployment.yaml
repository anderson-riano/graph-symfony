apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderflow-worker
  namespace: orderflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orderflow-worker
  template:
    metadata:
      labels:
        app: orderflow-worker
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: graph-symfony-php:latest
          imagePullPolicy: IfNotPresent
          command:
            - php
            - bin/console
            - messenger:consume
            - async
            - -vv
            - --time-limit=3600
            - --memory-limit=256M
            - --failure-limit=20
            - --sleep=1000000
          envFrom:
            - configMapRef:
                name: orderflow-config
            - secretRef:
                name: orderflow-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
